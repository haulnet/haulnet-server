name: Release

# A release is a tag vX.Y.Z: pushed by hand (first, minor and major versions) or created by auto-release.yml after
# CI passes on main (patch versions). Tags pushed by auto-release.yml use GITHUB_TOKEN, which starts no workflows,
# so that workflow calls this one directly.
on:
  push:
    tags: ["v*"]
  workflow_call:
    inputs:
      tag:
        description: Tag to release, e.g. v0.1.1
        required: true
        type: string

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test ./...
      - name: Version from tag
        run: |
          echo "VERSION=${TAG#v}" >> "$GITHUB_ENV"
          echo "REVISION=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Package
        run: scripts/package.sh "$VERSION"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          build-args: |
            VERSION=${{ env.VERSION }}
            REVISION=${{ env.REVISION }}
          tags: |
            ghcr.io/${{ github.repository }}:${{ env.VERSION }}
            ghcr.io/${{ github.repository }}:latest
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          . ./luxon.lock
          gh release create "$TAG" build/*.tar.gz build/*.zip build/docker/* build/SHA256SUMS \
            --verify-tag --title "haulnet-server $VERSION" --generate-notes \
            --notes "LuxonServer ${LUXON_VERSION}. Image: ghcr.io/${GITHUB_REPOSITORY}:${VERSION}"
