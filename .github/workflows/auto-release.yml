name: Auto release

# Every commit on main that passes CI and changes more than docs or repository settings becomes the next patch
# release, so official servers (which follow :latest with haulnet-update) pick it up by themselves. Minor and major
# versions are tagged by hand.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: write
  packages: write

concurrency:
  group: auto-release
  cancel-in-progress: false

jobs:
  tag:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.next.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Next patch version
        id: next
        env:
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          if [ "$(git rev-parse HEAD)" != "$SHA" ]; then
            echo "main has moved past $SHA; the newer commit's CI run releases it"; exit 0
          fi
          if git tag --points-at "$SHA" | grep -q '^v'; then
            echo "$SHA is already released"; exit 0
          fi
          last="$(git tag --merged "$SHA" --list 'v*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1 || true)"
          if [ -z "$last" ]; then
            echo "no release yet: tag the first version by hand"; exit 0
          fi
          # Files that do not change what a server runs: docs and repository settings. A release with only these
          # would restart official servers for nothing; they go out with the next release that changes code.
          non_code='\.md$|(^|/)\.git(ignore|attributes)$|^\.editorconfig$|^LICENSE$'
          if ! git diff --name-only "$last" "$SHA" | grep -qvE "$non_code"; then
            echo "only documentation or repository settings changed since $last"; exit 0
          fi
          IFS=. read -r major minor patch <<<"${last#v}"
          tag="v$major.$minor.$((patch + 1))"
          git tag "$tag" "$SHA"
          git push origin "refs/tags/$tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Released $SHA as $tag (previous $last)" >> "$GITHUB_STEP_SUMMARY"

  release:
    needs: tag
    if: needs.tag.outputs.tag != ''
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.tag.outputs.tag }}
    permissions:
      contents: write
      packages: write
